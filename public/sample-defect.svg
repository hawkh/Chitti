<svg width="640" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="640" fill="#e5e7eb"/>
  
  <!-- Metal surface texture -->
  <defs>
    <pattern id="metal" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#9ca3af"/>
      <circle cx="10" cy="10" r="1" fill="#6b7280"/>
    </pattern>
  </defs>
  
  <!-- Base metal surface -->
  <rect x="50" y="50" width="540" height="540" fill="url(#metal)" stroke="#374151" stroke-width="2"/>
  
  <!-- Simulated crack defect -->
  <path d="M 150 200 Q 200 180 250 200 Q 300 220 350 200 Q 400 180 450 200" 
        stroke="#dc2626" stroke-width="3" fill="none" opacity="0.8"/>
  
  <!-- Simulated void/hole -->
  <circle cx="200" cy="400" r="25" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  
  <!-- Simulated corrosion -->
  <ellipse cx="450" cy="350" rx="40" ry="30" fill="#f59e0b" opacity="0.6"/>
  <ellipse cx="460" cy="360" rx="20" ry="15" fill="#d97706" opacity="0.8"/>
  
  <!-- Simulated surface irregularity -->
  <path d="M 300 500 Q 320 480 340 500 Q 360 520 380 500 Q 400 480 420 500" 
        stroke="#7c3aed" stroke-width="4" fill="none" opacity="0.7"/>
  
  <!-- Labels -->
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Crack</text>
  <text x="200" y="450" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Void</text>
  <text x="450" y="320" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Corrosion</text>
  <text x="360" y="480" font-family="Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">Surface Irregularity</text>
  
  <!-- Title -->
  <text x="320" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Sample Welding Defects</text>
</svg>